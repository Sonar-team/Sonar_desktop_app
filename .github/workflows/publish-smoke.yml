name: Publish Smoke

on:
  workflow_dispatch:

jobs:
  publish-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-2022"
            args: ""
          - platform: "macos-14"
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: load build versions
        id: versions
        shell: bash
        run: ./script/ci/export-build-versions.sh

      - name: setup deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: "v${{ steps.versions.outputs.DENO_VERSION }}"

      - name: install Rust pinned version
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: ${{ steps.versions.outputs.RUST_VERSION }}
          targets: ${{ matrix.platform == 'macos-14' && steps.versions.outputs.MACOS_TARGET || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          sudo ./script/ci/use-apt-snapshot.sh
          sudo ./script/ci/apt-install-pinned.sh $LINUX_APT_PACKAGES

      - name: install frontend dependencies deterministically
        run: deno install --frozen

      - name: smoke build bundles with Tauri
        shell: bash
        env:
          BUILD_ARGS: ${{ matrix.args }}
          BUILD_TARGET: ${{ matrix.platform == 'macos-14' && steps.versions.outputs.MACOS_TARGET || '' }}
        run: |
          set -euo pipefail
          if [[ -n "$BUILD_TARGET" && -n "$BUILD_ARGS" ]]; then
            npm run tauri build -- $BUILD_ARGS --target "$BUILD_TARGET"
          elif [[ -n "$BUILD_TARGET" ]]; then
            npm run tauri build -- --target "$BUILD_TARGET"
          elif [[ -n "$BUILD_ARGS" ]]; then
            npm run tauri build -- $BUILD_ARGS
          else
            npm run tauri build
          fi

      - name: Collect release binary
        id: release-binary
        shell: bash
        run: |
          binary_path="$(./script/ci/collect-release-binary.sh "${{ matrix.platform }}")"
          echo "binary_path=${binary_path}" >> "$GITHUB_OUTPUT"

      - name: Validate Windows release binary structure
        if: matrix.platform == 'windows-2022'
        shell: pwsh
        run: ./script/ci/validate-windows-release-binary.ps1 -BinaryPath "${{ steps.release-binary.outputs.binary_path }}"

      - name: Ensure Windows bundle does not embed Npcap
        if: matrix.platform == 'windows-2022'
        shell: pwsh
        run: ./script/ci/check-windows-bundles-no-npcap.ps1

      - name: Validate release binary startup logs
        if: matrix.platform != 'windows-2022'
        shell: bash
        run: ./script/ci/smoke-test-release-binary.sh "${{ steps.release-binary.outputs.binary_path }}"

      - name: Collect Windows NSIS installer
        if: matrix.platform == 'windows-2022'
        shell: bash
        run: ./script/ci/collect-release-bundles.sh windows-2022

      # Artefact consommé par le job windows-e2e-npcap ci-dessous, qui
      # exécute réellement l'installeur sur un runner self-hosted où Npcap
      # est déjà présent (#146 phase 1 ; cf. security/licences.md).
      - name: Upload Windows NSIS installer artifact
        if: matrix.platform == 'windows-2022'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sonar-windows-nsis-installer
          path: release-artifacts/*setup.exe
          if-no-files-found: error

  # Installe réellement le paquet NSIS de release et vérifie que SONAR
  # détecte Npcap au démarrage (#146 phase 1). Nécessite un runner
  # self-hosted où Npcap est installé manuellement en mode "WinPcap
  # API-compatible" (cf. security/licences.md, #138) : la licence Npcap
  # gratuite n'autorise pas une installation silencieuse/automatisée sur un
  # runner hébergé. Ce job ne doit JAMAIS être déclenché par une pull
  # request (le workflow reste workflow_dispatch-only) — un runner
  # self-hosted ne doit jamais exécuter de code provenant d'une fork non
  # fiable.
  windows-e2e-npcap:
    needs: publish-smoke
    runs-on: [self-hosted, windows, npcap]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Download Windows NSIS installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sonar-windows-nsis-installer
          path: windows-installer

      - name: Install + Npcap detection E2E
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path windows-installer -Filter "*setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "No NSIS installer found in windows-installer/" }
          ./script/ci/run-sonar-windows-e2e.ps1 -InstallerPath $installer.FullName -ArtifactsDir windows-e2e-artifacts

      - name: Upload Windows E2E artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-e2e-npcap-logs
          path: windows-e2e-artifacts/**
          if-no-files-found: warn
