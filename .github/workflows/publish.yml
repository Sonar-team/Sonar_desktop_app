name: "publish"

on:
  push:
    tags:
      # Tags de release au format vX.Y.Z (ex. v4.2.0)
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  reproducibility-check:
    name: verify unsigned reproducible binary
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: load build versions
        id: versions
        shell: bash
        run: ./script/ci/export-build-versions.sh

      - name: setup deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: "v${{ steps.versions.outputs.DENO_VERSION }}"

      - name: install Rust pinned version
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: ${{ steps.versions.outputs.RUST_VERSION }}

      - name: install dependencies
        shell: bash
        run: |
          sudo ./script/ci/use-apt-snapshot.sh
          sudo ./script/ci/apt-install-pinned.sh $LINUX_APT_PACKAGES

      - name: install frontend dependencies deterministically
        run: deno install --frozen

      - name: verify reproducible Linux build
        shell: bash
        env:
          TAURI_BUILD_CMD: "deno task tauri build --ci --no-sign --no-bundle"
          # Builds réellement isolés (checkout, target/, node_modules
          # distincts par run), cf. security/repro-check.sh (#136).
          ISOLATED: "1"
        run: ./security/repro-check.sh

  create-release:
    name: create GitHub release
    needs: reproducibility-check
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./script/ci/create-release.sh "${GITHUB_REF_NAME}"

  publish-tauri:
    name: build and publish release artifacts
    needs: create-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-14"
            args: ""
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-2022"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: load build versions
        id: versions
        shell: bash
        run: ./script/ci/export-build-versions.sh

      - name: setup deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: "v${{ steps.versions.outputs.DENO_VERSION }}"

      - name: install Rust pinned version
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: ${{ steps.versions.outputs.RUST_VERSION }}
          targets: ${{ matrix.platform == 'macos-14' && steps.versions.outputs.MACOS_TARGET || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          sudo ./script/ci/use-apt-snapshot.sh
          sudo ./script/ci/apt-install-pinned.sh $LINUX_APT_PACKAGES

      - name: install frontend dependencies deterministically
        run: deno install --frozen

      - name: Build release binary
        shell: bash
        env:
          TAURI_BUILD_ARGS: ${{ matrix.platform == 'macos-14' && format('--target {0}', steps.versions.outputs.MACOS_TARGET) || matrix.args }}
        run: deno run -A ./security/repro-env.ts run bash -lc 'deno task tauri build --ci --no-sign --no-bundle ${TAURI_BUILD_ARGS}'

      - name: Collect release binary
        id: release-binary
        shell: bash
        run: |
          binary_path="$(./script/ci/collect-release-binary.sh "${{ matrix.platform }}")"
          echo "binary_path=${binary_path}" >> "$GITHUB_OUTPUT"

      - name: Validate Windows release binary structure
        if: matrix.platform == 'windows-2022'
        shell: pwsh
        run: ./script/ci/validate-windows-release-binary.ps1 -BinaryPath "${{ steps.release-binary.outputs.binary_path }}"

      - name: Validate release binary startup logs
        if: matrix.platform != 'windows-2022'
        shell: bash
        run: ./script/ci/smoke-test-release-binary.sh "${{ steps.release-binary.outputs.binary_path }}"

      - name: Build release bundles
        shell: bash
        env:
          TAURI_BUILD_ARGS: ${{ matrix.platform == 'macos-14' && format('--target {0}', steps.versions.outputs.MACOS_TARGET) || matrix.args }}
        run: deno task tauri build --ci --no-sign ${TAURI_BUILD_ARGS}

      - name: Ensure Windows bundle does not embed Npcap
        if: matrix.platform == 'windows-2022'
        shell: pwsh
        run: ./script/ci/check-windows-bundles-no-npcap.ps1

      # Tauri's .deb bundler timestamps its ar/tar members with real build
      # wall-clock time, ignoring SOURCE_DATE_EPOCH -- see #107 and
      # script/package-deb-repro.sh's own comments. Repacked in place, right
      # before it's collected/uploaded/hashed/signed below, so the artifact
      # users actually receive is the deterministic one (this step is the
      # real release path; script/release/repro-build-container.sh only
      # proves the concept inside an isolated container build).
      - name: Repack release .deb deterministically
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          epoch="$(git log -1 --format=%ct HEAD)"
          for deb in src-tauri/target/release/bundle/deb/*.deb; do
            SOURCE_DATE_EPOCH="$epoch" ./script/package-deb-repro.sh "$deb" "$deb"
          done

      - name: Collect release bundles
        shell: bash
        run: ./script/ci/collect-release-bundles.sh "${{ matrix.platform }}"

      - name: Upload release artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" release-artifacts/* --clobber

      - name: Generate SHA256 checksums
        shell: bash
        run: ./script/ci/generate-release-hashes.sh "${{ matrix.platform }}"

      - name: List attestation subjects
        id: attestation-subjects
        shell: bash
        run: ./script/ci/generate-attestation-subjects.sh "${{ matrix.platform }}"

      - name: Generate provenance attestation
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763
        with:
          subject-path: ${{ steps.attestation-subjects.outputs.subject-paths }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: "v${{ steps.versions.outputs.COSIGN_VERSION }}"

      - name: Sign release artifacts
        shell: bash
        run: ./script/ci/sign-release-artifacts.sh "${{ matrix.platform }}"

      - name: Create signed offline verification kit
        shell: bash
        run: ./script/ci/create-offline-verification-kit.sh "${{ matrix.platform }}"

      - name: Generate offline kit provenance attestation
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763
        with:
          subject-path: offline-kits/*.tar.gz

      - name: Upload offline verification kit to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" offline-kits/*.tar.gz --clobber

      - name: Upload Sigstore bundles to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./script/ci/upload-sigstore-bundles.sh "${{ matrix.platform }}"

      - name: Upload Sigstore bundles artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sigstore-bundles-${{ matrix.platform }}
          path: |
            release-signatures/${{ matrix.platform }}-*.sigstore.json
          if-no-files-found: error

      - name: Upload release hashes artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-hashes-${{ matrix.platform }}
          path: |
            release-hashes-${{ matrix.platform }}.md
            release-hashes-${{ matrix.platform }}-offline-kit.md
          if-no-files-found: error

      - name: Upload offline verification kit artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: offline-verification-kit-${{ matrix.platform }}
          path: offline-kits/*.tar.gz
          if-no-files-found: error

  publish-sbom:
    name: generate and publish SBOM artifacts
    needs: create-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: load build versions
        id: versions
        shell: bash
        run: ./script/ci/export-build-versions.sh

      - name: install Rust pinned version
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: ${{ steps.versions.outputs.RUST_VERSION }}

      - name: install SBOM tooling
        shell: bash
        run: ./script/ci/install-sbom-tools.sh

      - name: Generate SBOM artifacts
        shell: bash
        run: ./script/ci/generate-sbom-artifacts.sh

      - name: Collect SBOM release artifacts
        shell: bash
        run: |
          version="$(jq -r '.version' package.json)"
          mkdir -p sbom-release-artifacts
          cp "sbom/sonar-backend-${version}.cdx.json" \
            "sbom/sonar-frontend-${version}.cdx.json" \
            sbom-release-artifacts/

      - name: Upload SBOM artifacts to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" sbom-release-artifacts/* --clobber

      - name: Generate SHA256 checksums
        shell: bash
        run: ./script/ci/generate-release-hashes.sh sbom sbom-release-artifacts

      - name: List attestation subjects
        id: attestation-subjects
        shell: bash
        run: ./script/ci/generate-attestation-subjects.sh sbom sbom-release-artifacts

      - name: Generate provenance attestation
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763
        with:
          subject-path: ${{ steps.attestation-subjects.outputs.subject-paths }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: "v${{ steps.versions.outputs.COSIGN_VERSION }}"

      - name: Sign SBOM artifacts
        shell: bash
        run: ./script/ci/sign-release-artifacts.sh sbom sbom-release-artifacts

      - name: Upload Sigstore bundles to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./script/ci/upload-sigstore-bundles.sh sbom

      - name: Upload Sigstore bundles artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sigstore-bundles-sbom
          path: |
            release-signatures/sbom-*.sigstore.json
          if-no-files-found: error

      - name: Upload release hashes artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-hashes-sbom
          path: release-hashes-sbom.md
          if-no-files-found: error

  update-release-body:
    name: publish release hashes after artifact build
    needs: [publish-tauri, publish-sbom]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Download release hashes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-hashes-*
          path: release-hashes
          merge-multiple: true

      - name: Update GitHub release body with hashes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./script/ci/update-release-body.sh "${GITHUB_REF_NAME}"

  # Publication atomique (#136) : la release, créée en draft, ne devient
  # publique que si TOUTES les plateformes ont construit, passé le smoke
  # test, uploadé bundles, hashes, attestations et signatures. Un échec en
  # amont laisse un draft invisible, jamais une release publique partielle.
  finalize-release:
    name: publish the release once complete
    needs: [update-release-body]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Publish release (draft -> public)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
