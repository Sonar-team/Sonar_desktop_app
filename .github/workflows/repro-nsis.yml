name: Repro NSIS

# Preuve que l'installateur Windows est reproductible (#119) : deux builds
# indépendants du MÊME commit, sur un runner Windows natif, doivent produire
# un setup.exe au hash identique.
#
# Deux arborescences séparées et deux CARGO_TARGET_DIR distincts : aucun
# artefact du premier build ne peut être réutilisé par le second, sinon la
# comparaison ne prouverait rien.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src-tauri/tauri.conf.json"
      - "script/ci/normalize-bundle-mtimes.sh"
      - "src-tauri/tauri.windows.conf.json"
      - "src-tauri/windows/**"
      - ".github/workflows/repro-nsis.yml"

jobs:
  # Test 1 — condition d'origine de #119 : deux builds successifs au MÊME
  # emplacement. C'est ainsi que la non-reproductibilité a été constatée.
  repro-same-path:
    name: deux builds au même emplacement
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: load build versions
        id: versions
        shell: bash
        run: ./script/ci/export-build-versions.sh

      - name: setup deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: "v${{ steps.versions.outputs.DENO_VERSION }}"

      - name: install Rust pinned version
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: ${{ steps.versions.outputs.RUST_VERSION }}

      - name: install frontend dependencies deterministically
        run: deno install --frozen

      - name: build twice, same path, compare
        shell: bash
        run: |
          set -euo pipefail
          build() {
            # Le bundle est retiré entre les deux passes : makensis doit le
            # régénérer, sinon la seconde comparaison serait triviale.
            rm -rf src-tauri/target/release/bundle
            # La sortie de compilation part sur stderr : seul le chemin de
            # l'installateur doit atteindre stdout, que l'appelant capture.
            deno run -A ./security/repro-env.ts run bash -lc \
              'deno task tauri build --ci --no-sign' >&2
            find src-tauri/target/release/bundle -name '*setup.exe' -print -quit
          }

          a="$(build)"; cp "$a" setup-a.exe
          b="$(build)"; cp "$b" setup-b.exe

          ha="$(sha256sum setup-a.exe | cut -d' ' -f1)"
          hb="$(sha256sum setup-b.exe | cut -d' ' -f1)"
          echo "A: $ha"
          echo "B: $hb"
          echo "Taille A : $(wc -c <setup-a.exe)"
          echo "Taille B : $(wc -c <setup-b.exe)"

          if [[ "$ha" == "$hb" ]]; then
            echo "✅ setup.exe reproductible au même emplacement (#119 corrigé)"
            exit 0
          fi
          echo "::error::NON reproductible au même emplacement"
          cmp setup-a.exe setup-b.exe || true
          exit 1

      - name: upload installers on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nsis-same-path
          path: |
            setup-a.exe
            setup-b.exe
          if-no-files-found: ignore

  # Test 2 — variation d'emplacement, exigence plus forte
  # (reproducible-builds.org la traite comme une variation à part entière).
  # Informatif : un échec ici avec un succès ci-dessus signifie que des
  # chemins absolus fuient dans l'installateur, ce qui est un autre défaut.
  repro-varied-path:
    name: emplacements différents (informatif)
    runs-on: windows-2022
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          path: build-a
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          path: build-b

      - name: load build versions
        id: versions
        shell: bash
        working-directory: build-a
        run: ./script/ci/export-build-versions.sh

      - name: setup deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: "v${{ steps.versions.outputs.DENO_VERSION }}"

      - name: install Rust pinned version
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: ${{ steps.versions.outputs.RUST_VERSION }}

      - name: build in both trees
        shell: bash
        run: |
          set -euo pipefail
          for side in a b; do
            (cd "build-$side" && deno install --frozen \
              && deno run -A ./security/repro-env.ts run bash -lc \
                'deno task tauri build --ci --no-sign')
          done

      - name: compare
        shell: bash
        run: |
          set -uo pipefail
          a="$(find build-a -name '*setup.exe' -print -quit)"
          b="$(find build-b -name '*setup.exe' -print -quit)"
          ha="$(sha256sum "$a" | cut -d' ' -f1)"
          hb="$(sha256sum "$b" | cut -d' ' -f1)"
          echo "A: $ha"; echo "B: $hb"
          if [[ "$ha" == "$hb" ]]; then
            echo "✅ reproductible malgré des emplacements différents"
          else
            echo "::warning::dépendant de l'emplacement — des chemins absolus fuient dans l'installateur"
            echo "Taille A : $(wc -c <"$a") / B : $(wc -c <"$b")"
          fi
