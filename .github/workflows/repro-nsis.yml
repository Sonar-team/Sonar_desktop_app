name: Repro NSIS

# Preuve que l'installateur Windows est reproductible (#119) : deux builds
# indépendants du MÊME commit, sur un runner Windows natif, doivent produire
# un setup.exe au hash identique.
#
# Deux arborescences séparées et deux CARGO_TARGET_DIR distincts : aucun
# artefact du premier build ne peut être réutilisé par le second, sinon la
# comparaison ne prouverait rien.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src-tauri/tauri.conf.json"
      - "script/ci/normalize-bundle-mtimes.sh"
      - "src-tauri/tauri.windows.conf.json"
      - "src-tauri/windows/**"
      - ".github/workflows/repro-nsis.yml"

jobs:
  repro-nsis:
    name: deux builds NSIS doivent donner le même hash
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          path: build-a

      # Second checkout du même commit : arborescence distincte, aucun état
      # partagé avec la première.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          path: build-b

      - name: load build versions
        id: versions
        shell: bash
        working-directory: build-a
        run: ./script/ci/export-build-versions.sh

      - name: setup deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: "v${{ steps.versions.outputs.DENO_VERSION }}"

      - name: install Rust pinned version
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: ${{ steps.versions.outputs.RUST_VERSION }}

      - name: build A
        shell: bash
        working-directory: build-a
        env:
          CARGO_TARGET_DIR: target-a
        run: |
          set -euo pipefail
          deno install --frozen
          deno run -A ./security/repro-env.ts run bash -lc \
            'deno task tauri build --ci --no-sign'

      - name: build B
        shell: bash
        working-directory: build-b
        env:
          CARGO_TARGET_DIR: target-b
        run: |
          set -euo pipefail
          deno install --frozen
          deno run -A ./security/repro-env.ts run bash -lc \
            'deno task tauri build --ci --no-sign'

      - name: compare NSIS installers
        shell: bash
        run: |
          set -euo pipefail
          find_setup() {
            find "$1" -type f -name '*setup.exe' -print -quit
          }
          a="$(find_setup build-a)"
          b="$(find_setup build-b)"
          test -n "$a" || { echo "::error::aucun setup.exe produit par le build A"; exit 1; }
          test -n "$b" || { echo "::error::aucun setup.exe produit par le build B"; exit 1; }

          ha="$(sha256sum "$a" | cut -d' ' -f1)"
          hb="$(sha256sum "$b" | cut -d' ' -f1)"
          echo "A: $ha  $(basename "$a")"
          echo "B: $hb  $(basename "$b")"

          # Le binaire nu sert de témoin : il est déjà réputé reproductible
          # (#119), donc s'il diverge aussi, la cause n'est pas l'empaquetage.
          bina="$(find build-a -type f -path '*/release/sonar.exe' ! -path '*/bundle/*' -print -quit)"
          binb="$(find build-b -type f -path '*/release/sonar.exe' ! -path '*/bundle/*' -print -quit)"
          if [[ -n "$bina" && -n "$binb" ]]; then
            echo "binaire A: $(sha256sum "$bina" | cut -d' ' -f1)"
            echo "binaire B: $(sha256sum "$binb" | cut -d' ' -f1)"
          fi

          if [[ "$ha" == "$hb" ]]; then
            echo "✅ setup.exe reproductible"
            exit 0
          fi

          echo "::error::setup.exe NON reproductible : $ha != $hb"
          echo "Taille A : $(wc -c <"$a") octets"
          echo "Taille B : $(wc -c <"$b") octets"
          # Premier octet divergent : oriente le diagnostic (en-tête PE,
          # table des fichiers, charge compressée).
          cmp "$a" "$b" || true
          exit 1

      - name: upload installers on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nsis-divergent-installers
          path: |
            build-a/**/*setup.exe
            build-b/**/*setup.exe
          if-no-files-found: ignore
