name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Gates src-tauri : fmt, tests, clippy -D warnings, audit, vet, deny, udeps.
  rust_checks:
    runs-on: ubuntu-22.04
    env:
      RUSTUP_PERMIT_COPY_RENAME: "1"

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: load build versions
        id: versions
        shell: bash
        run: ./script/ci/export-build-versions.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: ${{ steps.versions.outputs.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Install nightly Rust for cargo udeps
        run: rustup toolchain install "${RUST_NIGHTLY_VERSION}" --profile minimal

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libpcap-dev

      - name: Install cargo tools
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-outdated --locked
          cargo install cargo-udeps --locked
          cargo install cargo-deny --locked
        working-directory: ./src-tauri

      # Installation depuis la racine : ne pas appliquer le remplacement
      # crates.io -> vendor réservé aux dépendances de l'application.
      - name: Install cargo-vet
        run: cargo install cargo-vet --version "${{ steps.versions.outputs.CARGO_VET_VERSION }}" --locked

      - name: Check formatting with cargo fmt
        run: cargo fmt -- --check
        working-directory: ./src-tauri

      - name: Run tests
        run: cargo test --verbose
        working-directory: ./src-tauri

      # Contrat IPC généré (#142) : le dossier est supprimé puis intégralement
      # régénéré par `export_ipc_bindings` (bindings ts-rs) ET
      # `export_ipc_fixtures` (JSON réellement produit par `CaptureEvent`,
      # cf. src-tauri/src/events/contract.rs) — le filtre "export_ipc" matche
      # les deux tests par substring de leur chemin complet. `git status
      # --porcelain` (pas `git diff`, qui ignore les fichiers non suivis)
      # compare le résultat à ce qui est commité. Ça détecte les trois
      # dérives possibles : contenu changé, fichier manquant à committer
      # (`git diff` seul le laisserait passer), et fichier obsolète resté du
      # commit précédent (un type renommé/supprimé n'efface pas son ancien
      # .ts, `cargo test` seul ne le recréerait pas non plus).
      - name: Check IPC contract is up to date
        run: |
          rm -rf src/types/generated
          (cd src-tauri && cargo test --lib export_ipc)
          if [ -n "$(git status --porcelain -- src/types/generated)" ]; then
            echo "::error::src/types/generated a dérivé des types Rust (ou n'est pas commité) :"
            git status --porcelain -- src/types/generated
            git --no-pager diff -- src/types/generated
            exit 1
          fi

      - name: Audit dependencies with cargo audit
        run: cargo audit
        working-directory: ./src-tauri

      # Les audits tiers sont figés dans imports.lock et les exemptions dans
      # config.toml représentent le backlog explicite. Toute nouvelle crate ou
      # version non couverte fait échouer ce gate sans accès réseau. Le store
      # est partagé avec sonar-rust : aucun check ne minimise les entrées de
      # l'autre graphe Cargo.
      - name: Vet dependency supply chain
        run: cargo vet --locked --frozen --no-minimize-exemptions
        working-directory: ./src-tauri

      - name: Run cargo clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: ./src-tauri

      - name: Check licenses and configurations with cargo deny
        run: cargo deny check
        working-directory: ./src-tauri

      - name: Check for outdated dependencies with cargo outdated
        run: |
          mv .cargo/config.toml .cargo/config.toml.bak
          trap 'mv .cargo/config.toml.bak .cargo/config.toml' EXIT
          cargo outdated
        working-directory: ./src-tauri

      - name: Check unused dependencies with cargo udeps
        run: cargo "+${RUST_NIGHTLY_VERSION}" udeps --all-targets --locked
        working-directory: ./src-tauri

  # Gates du workspace sonar-rust (sonar-flows-core + sonar-flows-cli),
  # source unique du domaine consommée par src-tauri (#135).
  sonar_rust_checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: load build versions
        id: versions
        shell: bash
        run: ./script/ci/export-build-versions.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: ${{ steps.versions.outputs.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Install libpcap (feature pcap de sonar-flows-core)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev

      - name: Install cargo-vet
        run: cargo install cargo-vet --version "${{ steps.versions.outputs.CARGO_VET_VERSION }}" --locked

      - name: Check formatting with cargo fmt
        run: cargo fmt -- --check
        working-directory: ./sonar-rust

      - name: Run cargo clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: ./sonar-rust

      - name: Run tests
        run: cargo test --locked --verbose
        working-directory: ./sonar-rust

      - name: Verify PCAP matrices against committed TShark oracles
        run: cargo test --locked -p sonar-flows-core --features pcap --test pcap_accuracy --verbose
        working-directory: ./sonar-rust

      # `cargo metadata` (utilisé par cargo-vet) résout le graphe complet du
      # Cargo.lock, y compris les dépendances conditionnées à une autre
      # plateforme (ex. android_system_properties, via iana-time-zone,
      # atteignable uniquement sur cfg(target_os = "android")). Les étapes
      # précédentes (fmt/clippy/test) ne construisent que pour l'hôte Linux et
      # ne les téléchargent donc jamais. Sans ce pré-chargement réseau, le
      # `--frozen` de l'étape suivante échoue sur un cache local incomplet —
      # le lockfile reste la seule source de vérité, ce pré-chargement ne
      # modifie rien (`--locked`).
      - name: Warm cargo cache for the full cross-platform lock graph
        run: cargo metadata --locked --format-version=1 > /dev/null
        working-directory: ./sonar-rust

      - name: Vet core and CLI supply chain
        run: cargo vet --store-path ../src-tauri/supply-chain --locked --frozen --no-minimize-exemptions
        working-directory: ./sonar-rust

  # Fuzzing borné du parseur PCAP et du lecteur de matrice (#151) : chaque
  # cible tourne un budget fixe sur un corpus dérivé des fixtures versionnées
  # (seeds de régression comprises, cf. fuzz/README.md). Un crash fait
  # échouer le job et son artefact est uploadé — la reproduction est alors
  # promue dans fuzz/regressions/<cible>/.
  fuzz_smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: load build versions
        id: versions
        shell: bash
        run: ./script/ci/export-build-versions.sh

      - name: Setup Rust nightly (requis par cargo-fuzz)
        run: |
          rustup toolchain install "${RUST_NIGHTLY_VERSION}" --profile minimal
          rustup component add rust-src --toolchain "${RUST_NIGHTLY_VERSION}"

      - name: Install libpcap (feature pcap de sonar-flows-core)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version "${{ steps.versions.outputs.CARGO_FUZZ_VERSION }}" --locked

      # Le corpus n'est pas committé (politique du fuzz/README.md) : il est
      # dérivé des fixtures versionnées, seeds de régression comprises.
      - name: Prepare fuzz corpus from versioned fixtures
        run: ./script/pcap/prepare-fuzz-corpus.sh

      # Budget délibérément court : la CI prouve l'absence de crash trivial
      # et l'exécutabilité des cibles à chaque PR ; les campagnes longues se
      # font hors CI. `-runs` borne aussi le cas où le temps ne suffit pas.
      - name: Fuzz pcap_reader (budget borné)
        run: |
          cargo "+${RUST_NIGHTLY_VERSION}" fuzz run pcap_reader \
            -- -max_total_time=90 -rss_limit_mb=4096 -timeout=10
        working-directory: ./sonar-rust/crates/sonar-flows-core

      - name: Fuzz matrix_reader (budget borné)
        run: |
          cargo "+${RUST_NIGHTLY_VERSION}" fuzz run matrix_reader \
            -- -max_total_time=90 -rss_limit_mb=4096 -timeout=10
        working-directory: ./sonar-rust/crates/sonar-flows-core

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fuzz-artifacts
          path: sonar-rust/crates/sonar-flows-core/fuzz/artifacts/
          if-no-files-found: ignore

  # Garde-fous de la chaîne de release (#136) : prouvent qu'une divergence
  # d'artefact bloque AVANT publication, avec un faux `gh` — sans toucher à
  # GitHub ni exiger un tag.
  release_guard_tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Publication idempotente et jamais destructive
        run: ./script/ci/tests/test-upload-release-assets-once.sh

  # Gates frontend : typecheck vue-tsc et tests Deno (#135).
  frontend_checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: load build versions
        id: versions
        shell: bash
        run: ./script/ci/export-build-versions.sh

      - name: setup deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: "v${{ steps.versions.outputs.DENO_VERSION }}"

      - name: Install frontend dependencies
        run: deno install --frozen

      - name: ESLint frontend
        run: deno task lint

      - name: Prettier configuration
        run: deno task format:check

      - name: Typecheck (vue-tsc)
        run: deno task typecheck

      - name: Run frontend tests
        run: deno task test
