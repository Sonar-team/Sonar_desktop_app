# Analyse clippy publiée dans l'onglet Sécurité (SARIF). Les gates bloquants
# (clippy -D warnings) vivent dans rust-ci.yml ; ce workflow alimente le
# tableau de bord code-scanning pour les deux workspaces.
#
# Réparé pour #135 : clippy tournait à la racine du dépôt (aucun Cargo.toml,
# résultat vide) sans dépendances système, et continue-on-error masquait
# l'échec. Il couvre désormais src-tauri ET sonar-rust.

name: rust-clippy analyze

on:
  push:
    branches: ["main"]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: ["main"]
  schedule:
    - cron: "15 15 * * 5"

jobs:
  rust-clippy-analyze:
    name: Run rust-clippy analyzing
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      security-events: write
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: load build versions
        id: versions
        shell: bash
        run: ./script/ci/export-build-versions.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: ${{ steps.versions.outputs.RUST_VERSION }}
          components: clippy

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libpcap-dev

      - name: Install required cargo
        run: cargo install clippy-sarif sarif-fmt

      - name: Run rust-clippy on src-tauri
        run: |
          cargo clippy \
            --all-features \
            --all-targets \
            --message-format=json \
            | clippy-sarif | tee rust-clippy-src-tauri.sarif | sarif-fmt
        working-directory: ./src-tauri

      - name: Run rust-clippy on sonar-rust
        run: |
          cargo clippy \
            --all-features \
            --all-targets \
            --message-format=json \
            | clippy-sarif | tee rust-clippy-sonar-rust.sarif | sarif-fmt
        working-directory: ./sonar-rust

      - name: Upload src-tauri analysis results to GitHub
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9
        with:
          sarif_file: src-tauri/rust-clippy-src-tauri.sarif
          category: clippy-src-tauri
          wait-for-processing: true

      - name: Upload sonar-rust analysis results to GitHub
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9
        with:
          sarif_file: sonar-rust/rust-clippy-sonar-rust.sarif
          category: clippy-sonar-rust
          wait-for-processing: true
