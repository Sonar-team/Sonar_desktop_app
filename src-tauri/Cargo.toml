[package]
name = "sonar"
version = "4.12.0"
description = "A Tauri network analyzer App"
authors = ["Cyprien Avico <akmot9@proton.me>"]
edition = "2024"
repository = "https://github.com/Sonar-team/Sonar_desktop_app"
license = "AGPL-3.0-only"
rust-version = "1.97.1"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


# Interdit les panics évitables dans le code de prod (issue #115).
# Les tests sont exemptés via clippy.toml (allow-unwrap-in-tests).
[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sonar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
tauri-plugin-log = "2.9.0"

[features]
default = []
capture_timing = ["packet_parser/parse_timing"]

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-shell = "2.3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-log = "2.8.0"
tauri-plugin-process = "2.3.1"

pcap = "2.4.0"
packet_parser = "10.0.0"
netdev = "0.42.0"
# Cœur métier partagé (matrice, CSV, paquets/tunnels, graphe, import PCAP),
# consommé aussi par sonar-cli : source unique du domaine, cf. VISION.md.
sonar-flows-core = { version = "=0.8.0", features = [
  "pcap",
] }

thiserror = "2.0.19"
# Génération du contrat IPC TypeScript depuis les types Rust (#142) : les
# fichiers de src/types/generated/ sont écrits par `cargo test export_ipc_bindings`.
ts-rs = "12.0.1"
crossbeam = "0.8.4"
parking_lot = "0.12.5"
log = "0.4.33"
chrono = "0.4.45"
tokio = "1.53.1"

libc = "0.2.186"
tauri-plugin-fs = "2.5.1"

csv = "1.4.0"
calamine = { version = "0.36.0", default-features = false, features = ["dates"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
dirs = "6.0.0"

colored = "3.1.1"
tauri-plugin-os = "2"
sysinfo = "0.38.4"
tauri-plugin-store = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-cli = "2"

[dev-dependencies]
# Runtime simulé pour tester les commandes IPC complètes sans fenêtre native
# ni boucle d'événements système (#168).
tauri = { version = "2.11.5", features = ["test"] }

[profile.release]
debug = false
strip = "symbols"
