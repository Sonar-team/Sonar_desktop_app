[workspace]
members = [
  "crates/sonar-flows-core",
  "crates/sonar-flows-cli",
]
resolver = "3"

[workspace.package]
authors = ["Sonar Team"]
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/Sonar-team/Sonar_desktop_app"
rust-version = "1.96.0"
version = "0.3.0"

[workspace.dependencies]
chrono = "0.4.45"
clap = { version = "4.5.53", features = ["derive"] }
csv = "1.4.0"
log = "0.4.33"
packet_parser = "8.1.0"
pcap = "2.4.0"
serde = { version = "1", features = ["derive"] }
sonar-flows-core = { path = "crates/sonar-flows-core", version = "0.3.0" }
thiserror = "2.0.18"

# Même politique que src-tauri : pas de panic évitable en code de prod.
[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
