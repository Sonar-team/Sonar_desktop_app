[package]
name = "sonar-flows-core"
description = "Reusable Sonar analysis core without Tauri dependencies"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
# La conversion PCAP tire libpcap (Npcap sous Windows) : optionnelle pour ne
# pas imposer cette dépendance système aux consommateurs matrice/CSV.
pcap = ["dep:pcap"]
# Lecture des matrices exportées en classeur XLSX : optionnelle pour ne pas
# imposer calamine (et sa pile zip) aux consommateurs qui ne lisent que du CSV.
xlsx = ["dep:calamine"]

[lints]
workspace = true

[dependencies]
calamine = { workspace = true, optional = true }
chrono.workspace = true
csv.workspace = true
log.workspace = true
packet_parser.workspace = true
pcap = { workspace = true, optional = true }
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
sha2 = "0.10.9"
